<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="780" viewBox="0 0 2400 780"><rect width="2400" height="780" fill="#0E0F11"/><g transform="translate(60.0,116.0)"><rect width="745.3" height="280.0" fill="#15171A"/><rect x="0.5" y="0.5" width="744.3" height="279.0" fill="none" stroke="#242830"/><g transform="translate(34,34) scale(0.146484)"><rect width="1024.00" height="1024.00" rx="224.00" fill="#FF5A2B"/><path d="M307.00 862.00L307.00 162.00L447.00 162.00A270.0 270.0 0 0 1 447.00 702.00L447.00 862.00ZM447.00 302.00A130.0 130.0 0 0 1 447.00 562.00Z" fill="#0B0C0E" fill-rule="evenodd"/></g><text x="212" y="62" font-family="DejaVu Sans Mono" font-size="16" fill="#F4F1EA" text-anchor="start" letter-spacing="1.2">01 — THE P</text><text x="212" y="84" font-family="DejaVu Sans Mono" font-size="11" fill="#FF5A2B" text-anchor="start" letter-spacing="1.6">CHOSEN</text><text x="212" y="118" font-family="Ubuntu" font-size="12.5" fill="#8A8D93" text-anchor="start" letter-spacing="0.0">One letter, one warm field.</text><text x="212" y="138" font-family="Ubuntu" font-size="12.5" fill="#8A8D93" text-anchor="start" letter-spacing="0.0">Reads at 16 px, scales to a billboard.</text></g><g transform="translate(827.3,116.0)"><rect width="745.3" height="280.0" fill="#15171A"/><rect x="0.5" y="0.5" width="744.3" height="279.0" fill="none" stroke="#242830"/><g transform="translate(34,34) scale(0.146484)"><rect width="1024" height="1024" rx="224" fill="#0B0C0E"/><path d="M288 880 L288 470 A 224 224 0 0 1 736 470 L736 880" fill="none" stroke="#F4F1EA" stroke-width="150" stroke-linecap="butt"/><circle cx="512" cy="672" r="100" fill="#FF5A2B"/></g><text x="212" y="62" font-family="DejaVu Sans Mono" font-size="16" fill="#F4F1EA" text-anchor="start" letter-spacing="1.2">02 — THE DOORWAY</text><text x="212" y="84" font-family="DejaVu Sans Mono" font-size="11" fill="#5E636B" text-anchor="start" letter-spacing="1.6">REJECTED</text><text x="212" y="118" font-family="Ubuntu" font-size="12.5" fill="#8A8D93" text-anchor="start" letter-spacing="0.0">A room you can drop into.</text><text x="212" y="138" font-family="Ubuntu" font-size="12.5" fill="#8A8D93" text-anchor="start" letter-spacing="0.0">Strong idea; reads as “n” at small sizes.</text></g><g transform="translate(1594.7,116.0)"><rect width="745.3" height="280.0" fill="#15171A"/><rect x="0.5" y="0.5" width="744.3" height="279.0" fill="none" stroke="#242830"/><g transform="translate(34,34) scale(0.146484)"><rect width="1024" height="1024" rx="224" fill="#0B0C0E"/><path d="M300 300 L300 560 A 212 212 0 0 0 724 560 L724 300" fill="none" stroke="#F4F1EA" stroke-width="190" stroke-linecap="butt"/><circle cx="512" cy="180" r="100" fill="#FF5A2B"/></g><text x="212" y="62" font-family="DejaVu Sans Mono" font-size="16" fill="#F4F1EA" text-anchor="start" letter-spacing="1.2">03 — THE U</text><text x="212" y="84" font-family="DejaVu Sans Mono" font-size="11" fill="#5E636B" text-anchor="start" letter-spacing="1.6">REJECTED</text><text x="212" y="118" font-family="Ubuntu" font-size="12.5" fill="#8A8D93" text-anchor="start" letter-spacing="0.0">The second letter, plus a presence dot.</text><text x="212" y="138" font-family="Ubuntu" font-size="12.5" fill="#8A8D93" text-anchor="start" letter-spacing="0.0">Charming, but ambiguous off-name.</text></g><g transform="translate(60.0,418.0)"><rect width="745.3" height="280.0" fill="#15171A"/><rect x="0.5" y="0.5" width="744.3" height="279.0" fill="none" stroke="#242830"/><g transform="translate(34,34) scale(0.146484)"><rect width="1024" height="1024" rx="224" fill="#0B0C0E"/><circle cx="512" cy="360" r="132" fill="#F4F1EA"/><circle cx="396" cy="592" r="132" fill="#F4F1EA"/><circle cx="628" cy="592" r="132" fill="#FF5A2B"/></g><text x="212" y="62" font-family="DejaVu Sans Mono" font-size="16" fill="#F4F1EA" text-anchor="start" letter-spacing="1.2">04 — THE HUDDLE</text><text x="212" y="84" font-family="DejaVu Sans Mono" font-size="11" fill="#5E636B" text-anchor="start" letter-spacing="1.6">REJECTED</text><text x="212" y="118" font-family="Ubuntu" font-size="12.5" fill="#8A8D93" text-anchor="start" letter-spacing="0.0">Three dots, a party of friends.</text><text x="212" y="138" font-family="Ubuntu" font-size="12.5" fill="#8A8D93" text-anchor="start" letter-spacing="0.0">Warm; merges into a blob at 16 px.</text></g><g transform="translate(827.3,418.0)"><rect width="745.3" height="280.0" fill="#15171A"/><rect x="0.5" y="0.5" width="744.3" height="279.0" fill="none" stroke="#242830"/><g transform="translate(34,34) scale(0.146484)"><rect width="1024" height="1024" rx="224" fill="#0B0C0E"/><path d="M256 700 L512 444 L768 700" fill="none" stroke="#F4F1EA" stroke-width="104" stroke-linecap="round" stroke-linejoin="round"/><path d="M256 452 L512 196 L768 452" fill="none" stroke="#FF5A2B" stroke-width="104" stroke-linecap="round" stroke-linejoin="round"/></g><text x="212" y="62" font-family="DejaVu Sans Mono" font-size="16" fill="#F4F1EA" text-anchor="start" letter-spacing="1.2">05 — THE CHEVRONS</text><text x="212" y="84" font-family="DejaVu Sans Mono" font-size="11" fill="#5E636B" text-anchor="start" letter-spacing="1.6">REJECTED</text><text x="212" y="118" font-family="Ubuntu" font-size="12.5" fill="#8A8D93" text-anchor="start" letter-spacing="0.0">“Up”, pure motion.</text><text x="212" y="138" font-family="Ubuntu" font-size="12.5" fill="#8A8D93" text-anchor="start" letter-spacing="0.0">Clear, but every other tool uses it.</text></g><g transform="translate(1594.7,418.0)"><rect width="745.3" height="280.0" fill="#15171A"/><rect x="0.5" y="0.5" width="744.3" height="279.0" fill="none" stroke="#242830"/><g transform="translate(34,34) scale(0.146484)"><rect width="1024" height="1024" rx="224" fill="#0B0C0E"/><path d="M512 216 A 196 196 0 1 0 512 608 A 196 196 0 1 0 512 216 ZM362 596 L662 596 L584 856 Q512 884 440 856 Z" fill="#F4F1EA"/></g><text x="212" y="62" font-family="DejaVu Sans Mono" font-size="16" fill="#F4F1EA" text-anchor="start" letter-spacing="1.2">06 — THE KEYHOLE</text><text x="212" y="84" font-family="DejaVu Sans Mono" font-size="11" fill="#5E636B" text-anchor="start" letter-spacing="1.6">REJECTED</text><text x="212" y="118" font-family="Ubuntu" font-size="12.5" fill="#8A8D93" text-anchor="start" letter-spacing="0.0">Access, invite code, your own server.</text><text x="212" y="138" font-family="Ubuntu" font-size="12.5" fill="#8A8D93" text-anchor="start" letter-spacing="0.0">Reads as a flask; wrong promise.</text></g><text x="60" y="36" font-family="DejaVu Sans Mono" font-size="13" fill="#8A8D93" text-anchor="start" letter-spacing="1.6">DIRECTIONS CONSIDERED — ONE CHOSEN</text><line x1="60" y1="48" x2="2340" y2="48" stroke="#242830"/><text x="60" y="754" font-family="DejaVu Sans Mono" font-size="12" fill="#5E636B" text-anchor="start" letter-spacing="0.0">the mark had to survive 16 px, one colour, and a taskbar of neighbours</text></svg>