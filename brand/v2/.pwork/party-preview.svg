<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1240" viewBox="0 0 2600 1240"><rect width="2600" height="1240" fill="#0B0C0E"/><g transform="translate(-80.0,40.0)"><svg x="0.0" y="0" width="520.0" height="1024" viewBox="252.0 0 520.0 1024">
  <g id="letter-p">
    <!-- body: one cap-height stem (ink 300..800), planted on the baseline -->
    <path d="M387 764 L387 336" fill="none" stroke="#F4F1EA" stroke-width="72"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- head: the bowl, lifted off the stem by a 40 air gap -->
    <circle cx="568" cy="405" r="105" fill="#FF5A2B"/>
  </g>
</svg><svg x="560.0" y="0" width="520.0" height="1024" viewBox="252.0 0 520.0 1024">
  <!-- PartyUp / letter a — 作者手稿：左侧大 C 碗 + 右竖干 + 头顶脱开的圆点
       x-height 440–800，笔画 72 -->
  <g fill="none" stroke="#F4F1EA" stroke-width="72" stroke-linecap="round" stroke-linejoin="round">
    <!-- 碗：C 形，上端接竖干顶部，下端在竖干中下部 -->
    <path d="M704 470 C545 470 470 512 470 578 C470 646 545 686 704 686"/>
    <!-- 竖干 -->
    <path d="M704 470 L704 764"/>
  </g>
  <!-- 头：碗顶上方，净空 26 -->
  <circle cx="704" cy="342" r="62" fill="#FF5A2B"/>
</svg><svg x="1120.0" y="0" width="520.0" height="1024" viewBox="252.0 0 520.0 1024">
  <!-- PartyUp v0.2 / letter r — body #F4F1EA, head #FF5A2B -->
  <!-- stem: x-centreline 372, ink bottom y=800 (centre ends 764); x-height top ink y=440 -->
  <!-- one continuous path: leg -> shoulder bend -> arm stump; stroke 72, round caps -->
  <g transform="translate(-5.5 0)">
    <g fill="none" stroke="#F4F1EA" stroke-width="72" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 372 764 L 372 560 C 372 505 478 478 575 476"/>
    </g>
    <!-- head: r 92, centre (607,316) before the -5.5 shift -->
    <circle cx="607" cy="316" r="92" fill="#FF5A2B"/>
  </g>
</svg><svg x="1680.0" y="0" width="520.0" height="1024" viewBox="252.0 0 520.0 1024">
<g fill="none" stroke="#F4F1EA" stroke-width="72" stroke-linecap="round" stroke-linejoin="round">
    <!-- stem: top 380 (60 above x-height, 80 below cap), foot turns right and lies flat on the ground -->
    <path d="M 512 380 L 512 708 C 512 730 534 764 616 764"/>
    <!-- crossbar: length 240, right end 12 higher -->
    <path d="M 392 476 L 632 464"/>
  </g>
</svg><svg x="2240.0" y="0" width="520.0" height="1024" viewBox="252.0 0 520.0 1024">
  <g fill="none" stroke="#F4F1EA" stroke-width="72" stroke-linecap="round" stroke-linejoin="round">
    <path d="M412 452 L516 716" />
    <path d="M656 438 L516 716 C520 800 548 892 582 962" />
  </g>
  <circle cx="396" cy="288" r="92" fill="#FF5A2B" />
</svg></g><line x1="-140.0" y1="840" x2="2740.0" y2="840" stroke="#242830"/></svg>