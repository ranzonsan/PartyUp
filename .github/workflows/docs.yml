name: docs

on:
  push:
    paths:
      - "docs/**"
      - "*.md"
      - "scripts/check-docs-headers.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "*.md"
      - "scripts/check-docs-headers.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: 相对链接
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # --offline：只检查仓库内的相对链接，不发网络请求，避免外部站点抖动导致误报
          args: --offline --no-progress "docs/**/*.md" "*.md"
          fail: true

  headers:
    name: 状态头
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-docs-headers.py
