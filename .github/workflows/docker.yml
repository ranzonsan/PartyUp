name: docker

# 服务端镜像：push tag server-v* 或 main 上 server/** 改动时构建多架构镜像推到 ghcr。
# 用户侧一条命令起服务端：docker run --network host ghcr.io/ranzonsan/partyup:latest
# 版本号来自 server/VERSION（服务端有独立的版本序列与 release 通道）。

on:
  push:
    tags: ["server-v*"]
    branches: [main]
    paths:
      - "server/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/partyup

jobs:
  build:
    name: build + push server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: read server/VERSION
        id: ver
        shell: bash
        run: echo "version=$(cat server/VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: login to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: docker metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=match,pattern=server-v(.*),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/server-v') || github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
